function addTok(t,rows,sv=1){const m=t.match(/^(.*?)(\d+(?:\.\d+)?)\s*(g|ｇ|グラム|個|枚|本|切れ|杯)?$/),n=m&&m[1]?m[1].trim():t,q=m&&m[1]?+m[2]:0,u=m&&m[1]?m[3]||"":"",x=find(n);

const g=q?(/^(g|ｇ|グラム)$/.test(u)?q:q*x.g):x.g*sv,ex=rows.find(r=>r.n==x.n);if(ex)ex.g=g;else rows.push({n:x.n,g,d:x.d})}
function calc(){let nm=$("dn").value.trim(),ing=$("di").value.trim();const pm=nm.match(/^(.*?)[（(](.*)[）)]$/);if(pm){nm=pm[1].trim();ing=pm[2]+(ing?"、"+ing:"")}
if(!nm&&!ing)return alert("料理名か食材を入力してください");
const sv=Math.max(1,Math.min(20,+$("dv").value||1)),rows=[],b=BASE.find(x=>x.k.some(k=>nm.includes(k)));
if(b)b.i.forEach(([n,g])=>{const x=DB.find(y=>y.n==n);rows.push({n:x.n,g:g*sv,d:x.d,b:1})});
ing.split(/[、,，・\n]+/).map(x=>x.trim()).filter(Boolean).forEach(t=>addTok(t,rows,sv));
CX={nm:nm||"自作料理",rows,b:!!b,sv};renderCalc()}
function sumR(rows){const t=[0,0,0,0,0,0];rows.forEach(r=>(r.d?r.d.map(x=>x*r.g/100).concat([(SALT[r.n]||0)*r.g/100,(FIB[r.n]||0)*r.g/100]):r.tot.concat([0,0])).forEach((x,j)=>t[j]+=x));return t.map(x=>x/((CX&&CX.sv)||1))}

function saveMi(){const g=v=>+$(v).value||0,n=$("xn").value.trim(),a=g("xa")||100;if(!n||!g("xk"))return alert("名前とkcalを入力してください");S.mi=S.mi.filter(x=>x.n!=n);S.mi.push({n,d:[g("xk"),g("xp"),g("xf"),g("xc")].map(x=>x*100/a),g:a,al:[]});save();renderMF()}

function saveDirect(){const g=v=>+$(v).value||0,n=$("yn").value.trim();if(!n||!g("yk"))return alert("名前とkcalを入力してください");S.my=S.my.filter(x=>x.n!=n);S.my.push({n,k:g("yk"),p:g("yp"),f:g("yf"),c:g("yc")});save();renderMy();renderMF()}
const NI=(id,ph)=>`<input id="${id}" type="number" inputmode="decimal" placeholder="${ph}">`;
function renderMF(){$("mf").innerHTML=`<div class="card"><h2>マイ食材を登録</h2><div class="sub">プロテイン・グラノーラなど。パッケージの栄養成分表示を、表示どおりに入力します。登録すると、食材欄に名前を書くだけで使えます（例：プロテイングラノーラ30g、ベイクドオーツsoy30g のように混ぜた量も計算可能）。</div>
<label style="margin-top:8px">食材名</label><input id="xn" placeholder="例：プロテイングラノーラ"><label style="margin-top:6px">表示の量（g）</label><input id="xa" type="number" inputmode="decimal" value="100">
<div class="g" style="margin-top:6px">${NI("xk","kcal")}${NI("xp","たんぱく質g")}${NI("xf","脂質g")}${NI("xc","炭水化物g")}</div><button class="btn" style="width:100%;margin-top:8px" onclick="saveMi()">食材を登録</button>
${S.mi.map((x,i)=>`<div class="meal"><div><b>${E(x.n)}</b><span class="sub">${R(x.g)}gで${R(x.d[0]*x.g/100)}kcal</span></div><button class="btn s sm" onclick="delMi(${i})">削除</button></div>`).join("")}</div>
<div class="card"><h2>マイ料理を数値で直接登録</h2><div class="sub">栄養が分かっている1食分を、食事の区分なしで登録できます。</div><label style="margin-top:8px">料理名</label><input id="yn"><div class="g" style="margin-top:6px">${NI("yk","kcal")}${NI("yp","たんぱく質g")}${NI("yf","脂質g")}${NI("yc","炭水化物g")}</div><button class="btn" style="width:100%;margin-top:8px" onclick="saveDirect()">マイ料理に登録</button></div>`}
function sug(){const q=$("fn").value.trim().toLowerCase(),el=$("sg");if(!q){el.innerHTML="";return}const m=S.my.map((x,i)=>[x,i]).filter(([x])=>x.n.toLowerCase().includes(q)).slice(0,6);
el.innerHTML=m.length?m.map(([x,i])=>`<div class="meal"><div><b>${E(x.n)}</b><span class="sub">${x.k}kcal・${pfc(x.p,x.f,x.c)}</span></div><button class="btn sm" onclick="addMy(${i})">${MN4[S.rm]}に追加</button></div>`).join(""):`<div class="note">マイ料理に該当なし。下に栄養を入れて追加するか、<a href="#" onclick="S.tab=3;save();go();return false">料理タブで計算・登録</a>できます。</div>`}
function bkOut(){const t=$("bk");t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function bkIn(){try{const o=JSON.parse($("bk").value);if(!o.p)throw 0;S=norm(o);save();prune();vSet();alert("読み込みました")}catch(e){alert("読み込めませんでした")}}
const dd=i=>{if(i<1000)return D[i];const x=S.my[i-1000];return[x.n,"m",x.k,x.p,x.f,x.c,"",(x.rows||[]).map(r=>r.n),x.s||0,x.fb||0]};
const pk=k=>{const q=k.split("-");return new Date(q[0],q[1]-1,q[2]).getTime()};
function dayS(pi,o){const k=key(-o),a=(S.log[k]||{})[pi];return a?sum(a):((S.hist[k]||{})[pi]||null)}
function weekCard(pi,t){const ds=[1,2,3,4,5,6,7].map(o=>dayS(pi,o)).filter(x=>x&&x.k>0),n=ds.length;if(!n)return"";const av=f=>ds.reduce((s,x)=>s+x[f],0)/n;
return`<div class="card"><h2>直近7日のまとめ</h2><div class="sub">記録のある日：${n}日</div>${bar("平均エネルギー",av("k"),t.k,"kcal")}${bar("平均たんぱく質",av("p"),t.p,"g")}<div class="sub">目標±10%の日：${ds.filter(x=>x.k>=t.k*.9&&x.k<=t.k*1.1).length}日／たんぱく質90%以上の日：${ds.filter(x=>x.p>=t.p*.9).length}日</div></div>`}
function wtCard(pi){const e=Object.keys(S.wt).filter(k=>S.wt[k][pi]).filter(k=>pk(k)>=Date.now()-S.cr*864e5).sort((a,b)=>pk(a)-pk(b)).map(k=>[k,S.wt[k][pi]]);let g="";
if(e.length>1){const v=e.map(x=>x[1]),lo=Math.min(...v)-.5,hi=Math.max(...v)+.5,X=i=>10+i*280/(e.length-1),Y=w=>80-(w-lo)/(hi-lo)*70,L=e[e.length-1],df=L[1]-e[0][1];
g=`<svg viewBox="0 0 300 90" style="width:100%"><polyline points="${e.map((x,i)=>X(i)+","+Y(x[1])).join(" ")}" fill="none" style="stroke:var(--ac)" stroke-width="2"/>${e.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="3" style="fill:var(--hot)"/>`).join("")}</svg><div class="row sub"><span>${e[0][0]} ${e[0][1]}kg</span><span>${L[0]} ${L[1]}kg（${df>0?"+":""}${df.toFixed(1)}）</span></div>`}
return`<div class="card"><h2>体重</h2>${g||'<div class="sub">2回以上記録するとグラフが出ます。</div>'}<div class="row" style="margin-top:8px"><input id="wv" type="number" inputmode="decimal" step="0.1" placeholder="今日の体重 kg"><button class="btn" style="white-space:nowrap" onclick="wtAdd(${pi})">記録</button></div><div class="sub">記録すると目標カロリーの計算にも反映されます。</div></div>`}
function wtAdd(pi){const v=+$("wv").value;if(!(v>=15&&v<=250))return alert("15〜250kgで入力してください");(S.wt[key(0)]=S.wt[key(0)]||{})[pi]=v;S.p[pi].w=v;save();vLog()}
function wipe(){if(confirm("全データを削除します。元に戻せません。")){try{localStorage.removeItem("gohan")}catch(e){}S=norm(null);go()}}
function norm(o){const d={p:[Object.assign(np(),{n:"自分"})],mode:"d",days:3,seed:1,cur:0,log:{},eaten:{},hist:{},wt:{},ov:{},cr:30,md:[],ls:true,my:[],mi:[],pin:["","",""],rm:0,amt:1,tab:0};if(!o||typeof o!="object")return d;
const n=x=>+x||0,t=x=>String(x==null?"":x).slice(0,60),ob=x=>x&&typeof x=="object"&&!Array.isArray(x)?x:{},ar=x=>Array.isArray(x)?x:[],dk=k=>/^\d{4}-\d{1,2}-\d{1,2}$/.test(k);
if(ar(o.p).length)d.p=o.p.slice(0,8).map(q=>{q=ob(q);const b=np();return{n:t(q.n),sex:q.sex=="m"?"m":"f",age:n(q.age)||b.age,h:n(q.h)||b.h,w:n(q.w)||b.w,act:ACT[q.act]?+q.act:1.375,goal:GO[q.goal]?q.goal:"n",ex:t(q.ex),gw:Math.min(250,Math.max(0,n(q.gw))),gk:Math.min(104,Math.max(0,n(q.gk)))}});
d.mode=MO[o.mode]?o.mode:"d";d.days=[1,3,5,7].includes(o.days)?o.days:3;d.seed=n(o.seed)||1;d.cur=Math.min(d.p.length-1,Math.max(0,n(o.cur)));d.tab=Math.min(4,Math.max(0,n(o.tab)));d.rm=[0,1,2,3].includes(o.rm)?o.rm:0;d.amt=[.5,.7,1,1.3,2].includes(o.amt)?o.amt:1;
d.cr=[30,90,365].includes(o.cr)?o.cr:30;d.md=Array.isArray(o.md)?o.md.filter((x,i,a)=>(x=="q"||x=="b")&&a.indexOf(x)==i):(o.mode=="q"?["q"]:o.mode=="b"?["b"]:[]);d.ls=o.ls!==false;for(const k in ob(o.ov))if(dk(k)){d.ov[k]={};for(const m in ob(o.ov[k]))if([0,1,2].includes(+m)){const i=n(o.ov[k][m]);if(i>=0&&i<D.length)d.ov[k][+m]=i}}
const ent=e=>{e=ob(e);return{n:t(e.n),m:e.m==null?null:n(e.m),pl:e.pl?1:0,k:n(e.k),p:n(e.p),f:n(e.f),c:n(e.c),s:n(e.s),fb:n(e.fb)}};
for(const k in ob(o.log))if(dk(k)){d.log[k]={};for(const j in ob(o.log[k]))d.log[k][+j]=ar(o.log[k][j]).slice(0,100).map(ent)}
for(const k in ob(o.eaten))if(dk(k)){d.eaten[k]={};for(const j in ob(o.eaten[k]))d.eaten[k][+j]=Object.fromEntries([0,1,2].filter(m=>ob(o.eaten[k][j])[m]).map(m=>[m,1]))}
for(const k in ob(o.hist))if(dk(k)){d.hist[k]={};for(const j in ob(o.hist[k])){const h=ob(o.hist[k][j]);d.hist[k][+j]={k:n(h.k),p:n(h.p),f:n(h.f),c:n(h.c),s:n(h.s),fb:n(h.fb)}}}
for(const k in ob(o.wt))if(dk(k)){d.wt[k]={};for(const j in ob(o.wt[k])){const v=n(o.wt[k][j]);if(v>=15&&v<=250)d.wt[k][+j]=v}}
d.my=ar(o.my).slice(0,300).map(x=>{x=ob(x);const r={n:t(x.n),k:n(x.k),p:n(x.p),f:n(x.f),c:n(x.c),s:n(x.s),fb:n(x.fb)};if(ar(x.rows).length){r.rows=x.rows.slice(0,40).map(y=>{y=ob(y);const q={n:t(y.n),g:n(y.g)};if(ar(y.d).length==4)q.d=y.d.map(n);else q.tot=[0,1,2,3].map(i=>n(ar(y.tot)[i]));if(y.b)q.b=1;return q});r.sv=Math.max(1,n(x.sv)||1)}return r}).filter(x=>x.n);
d.mi=ar(o.mi).slice(0,300).map(x=>{x=ob(x);return{n:t(x.n),d:[0,1,2,3].map(i=>n(ar(x.d)[i])),g:n(x.g)||100,al:[]}}).filter(x=>x.n);d.pin=[0,1,2].map(m=>t(ar(o.pin)[m]));return d}
// 買い物
function tgM(k){const i=S.md.indexOf(k);i>=0?S.md.splice(i,1):S.md.push(k);save();vSet()}
function planO(){const P=plan();P.forEach((r,o)=>{const v=S.ov[key(o)];if(v)for(const m in v)r[m]=v[m]});return P}
function sw(o,m){const P=planO(),ex=S.p.flatMap(p=>(p.ex||"").split(/[、,，\s]+/).filter(Boolean)),t=m?"m":"b",c=D.map((d,i)=>i).filter(i=>D[i][1]==t&&!P[o].includes(i)&&!ex.some(k=>D[i][0].includes(k)||D[i][7].some(g=>g.includes(k))));if(!c.length)return alert("候補がありません");const k=key(o);(S.ov[k]=S.ov[k]||{})[m]=c[Math.floor(Math.random()*c.length)];save();vPlan()}
function swr(o,m){delete(S.ov[key(o)]||{})[m];save();vPlan()}
const RN={30:"1か月",90:"3か月",365:"1年"};
function kcCard(pi,t){const N=S.cr,v=[];for(let o=N-1;o>=0;o--){const d=dayS(pi,o);v.push(d?d.k:0)}const mx=Math.max(t.k*1.3,...v),w=280/N,ty=90-t.k/mx*80;
return`<div class="card"><h2>カロリーの推移</h2><div class="chips">${[30,90,365].map(n=>`<button class="chip ${S.cr==n?'on':''}" onclick="S.cr=${n};save();vLog()">${RN[n]}</button>`).join("")}</div><svg viewBox="0 0 300 100" style="width:100%">${v.map((x,i)=>x?`<rect x="${10+i*w}" y="${90-x/mx*80}" width="${Math.max(w-.5,1)}" height="${x/mx*80}" style="fill:${x>t.k*1.1?'var(--hot)':'var(--ac)'}"/>`:'').join("")}<line x1="10" x2="290" y1="${ty}" y2="${ty}" stroke-dasharray="4" style="stroke:var(--sub)"/></svg><div class="sub">点線＝目標 ${R(t.k)}kcal／赤＝目標の10%超／記録のない日は空白（体重グラフも同じ期間）</div></div>`}
function bkFile(){const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a"),d=ds(0);a.href=URL.createObjectURL(b);a.download="gohan-backup-"+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+".json";a.click()}
function bkF(el){const f=el.files[0];if(!f||f.size>5e6)return alert("ファイルを確認してください");const r=new FileReader();r.onload=()=>{$("bk").value=r.result;bkIn()};r.readAsText(f)}
function vShop(){const P=planO(),c={},dc={};
for(let o=0;o<S.days;o++)P[o].forEach((di,m)=>{const x=dd(di);dc[x[0]]=(dc[x[0]]||0)+1;const my=di>=1000?S.my[di-1000]:null,L=my?(my.rows||[]).map(r=>[r.n,r.g/(my.sv||1)]):D[di][7].map(n=>{const q=find(n);return[n,q?q.g:40]});
S.p.forEach(p=>{const f=scale(x,T(p).k*W[m]);L.forEach(([n,g])=>{const e=c[n]=c[n]||{g:0,n:0};e.g+=g*f;e.n++})})});
$("v").innerHTML=`<div class="chips">${[1,3,5,7].map(n=>`<button class="chip ${S.days==n?'on':''}" onclick="S.days=${n};save();vShop()">${n}日分</button>`).join("")}</div>
<div class="card"><h2>買い物リスト（${S.p.length}人分）</h2><div class="sub">人ごとの量を反映した概算です。調味料・加工品は目安量なので、家にある分を引いてください。</div>${Object.entries(c).sort((a,b)=>b[1].g-a[1].g).map(([g,v])=>`<label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:15px;padding:3px 0"><input type="checkbox" style="width:auto">${E(g)}<span class="sub" style="margin-left:auto">${v.g>0?(g=="卵"?"約"+Math.ceil(v.g/50)+"個":"約"+Math.max(10,Math.round(v.g/10)*10)+"g"):"×"+v.n}</span></label>`).join("")}</div>
<div class="card"><h2>作るメニュー</h2><ul>${Object.entries(dc).map(([k,n])=>`<li>${E(k)}${n>1?' ×'+n:''}</li>`).join("")}</ul>${S.md.includes("b")?'<div class="note">作り置きモード：同じメニューを複数日で回すので、まとめて調理して小分け冷蔵・冷凍がおすすめです。</div>':''}</div>`}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
prune();save();go();
</script></body></html>
